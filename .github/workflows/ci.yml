name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: the only run that matters
# is the one for the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before the install, and with no dependency of its own, so a broken
      # environment cannot be the reason the docs check was skipped.
      - name: Per-file documentation coverage
        run: python scripts/check_docs.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy strict
        run: mypy src tests scripts

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version rather than stopping at the first.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # XGBoost's wheel links against libgomp. It is present on ubuntu-latest,
      # but installing it explicitly means an image change cannot silently turn
      # every xgboost test into a skip.
      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - run: python -m pip install -e ".[dev]"
      - name: Confirm XGBoost actually imports
        run: python -c "import xgboost; print(xgboost.__version__)"
      # The floor is a ratchet: it sits just under the measured total and is
      # raised, never lowered, as phases land. A drop below it fails the build.
      # Measured 97% locally with the three xgboost tests skipped, so the slack
      # is for line-count churn rather than for the skips - this job installs
      # libgomp1 above and therefore runs strictly more code than that reading.
      - name: pytest
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=95

  dashboard:
    name: Dashboard helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm ci` and no cache key: dashboard/package.json exists for
      # `"type": "module"` and one script, and there are no dependencies to
      # install. See docs/decisions/0009-vanilla-dashboard.md.
      - name: node --test
        working-directory: dashboard
        run: node --test

  smoke:
    name: End-to-end on synthetic data, and the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      # The serve extra as well as train: this job boots the real service, and a
      # missing serve dependency is exactly the failure a training-only install is
      # supposed to tolerate and this job is supposed to catch.
      - run: python -m pip install -e ".[train,serve]"
      # The only automated proof of the artifact contract. `reports/` is
      # gitignored, so nothing in the pytest suite ever sees a run tree published
      # by the real CLI.
      # --workdir keeps the tree instead of using a tempdir it deletes, so the
      # step below has something to upload when a check fails.
      - name: make-sample-data, compare, activate, card, serve, predict
        run: python scripts/smoke_e2e.py --workdir "${RUNNER_TEMP}/smoke"

      # The image is checked here rather than in a job of its own because a
      # serving container needs a bundle, and this is the job that just made one.
      # A separate job would either repeat the fit or pass a pickle between jobs
      # as an artifact.
      #
      # This is also the ONLY place the image is ever built: Docker is not
      # available on the machine this was written on, so an unverified Dockerfile
      # would be a file that looks like a deployment story and is not one.
      - name: Build the serving image
        run: docker build -t riskscore:ci .

      - name: Serve the smoke run from the container
        run: |
          set -euo pipefail
          # Read-only mount: a scoring service writes nothing, and :ro is how that
          # claim gets tested rather than asserted.
          docker run -d --name riskscore-ci -p 8000:8000 \
            -v "${RUNNER_TEMP}/smoke/reports:/app/reports:ro" riskscore:ci
          # Waits on the image's own HEALTHCHECK, which parses /readyz for
          # `bundle_loaded` - so this loop verifies the health probe as well as
          # the boot. `starting` means keep waiting; anything else is terminal.
          for _ in $(seq 45); do
            state="$(docker inspect -f '{{.State.Health.Status}}' riskscore-ci)"
            [ "$state" = "starting" ] || break
            sleep 2
          done
          docker logs riskscore-ci
          test "$state" = "healthy"

      # The same assertions the local process passed, against the container:
      # /predict, the reason-code sum, both 422 shapes, the batch, every
      # allowlisted artifact, the pickle 404, and the dashboard's own files.
      - name: The service checks, against the container
        run: python scripts/smoke_e2e.py --against http://127.0.0.1:8000

      - name: Stop the container
        if: always()
        run: docker rm -f riskscore-ci || true

      - name: Upload the run tree on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-tree
          # No model.joblib: a pickle built from a PR's code is not something to
          # hand out as a downloadable artifact.
          path: |
            ${{ runner.temp }}/smoke/reports/**
            ${{ runner.temp }}/smoke/serve.log
            !${{ runner.temp }}/smoke/reports/runs/*/model.joblib
          if-no-files-found: warn
