name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: the only run that matters
# is the one for the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before the install, and with no dependency of its own, so a broken
      # environment cannot be the reason the docs check was skipped.
      - name: Per-file documentation coverage
        run: python scripts/check_docs.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy strict
        run: mypy src tests scripts

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version rather than stopping at the first.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # XGBoost's wheel links against libgomp. It is present on ubuntu-latest,
      # but installing it explicitly means an image change cannot silently turn
      # every xgboost test into a skip.
      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - run: python -m pip install -e ".[dev]"
      - name: Confirm XGBoost actually imports
        run: python -c "import xgboost; print(xgboost.__version__)"
      # The floor is a ratchet: it starts just under the measured 85% and is
      # raised, never lowered, as phases land. A drop below it fails the build.
      - name: pytest
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80

  dashboard:
    name: Dashboard helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm ci` and no cache key: dashboard/package.json exists for
      # `"type": "module"` and one script, and there are no dependencies to
      # install. See docs/decisions/0009-vanilla-dashboard.md.
      - name: node --test
        working-directory: dashboard
        run: node --test

  smoke:
    name: End-to-end on synthetic data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      # The serve extra as well as train: this job boots the real service, and a
      # missing serve dependency is exactly the failure a training-only install is
      # supposed to tolerate and this job is supposed to catch.
      - run: python -m pip install -e ".[train,serve]"
      # The only automated proof of the artifact contract. `reports/` is
      # gitignored, so nothing in the pytest suite ever sees a run tree published
      # by the real CLI.
      # --workdir keeps the tree instead of using a tempdir it deletes, so the
      # step below has something to upload when a check fails.
      - name: make-sample-data, compare, activate, card, serve, predict
        run: python scripts/smoke_e2e.py --workdir "${RUNNER_TEMP}/smoke"
      - name: Upload the run tree on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-tree
          # No model.joblib: a pickle built from a PR's code is not something to
          # hand out as a downloadable artifact.
          path: |
            ${{ runner.temp }}/smoke/reports/**
            ${{ runner.temp }}/smoke/serve.log
            !${{ runner.temp }}/smoke/reports/runs/*/model.joblib
          if-no-files-found: warn
