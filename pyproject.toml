[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-default-risk-score"
version = "0.2.0"
description = "Leakage-aware credit default risk scoring: training pipeline, model bundles, and a FastAPI scoring service."
readme = "README.md"
# 3.12 floor: the codebase uses PEP 695-era typing style, `Self`, and
# `datetime.UTC`, and pandas 3.x wheels no longer target 3.10/3.11 uniformly.
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

# Extras are split by what a given deployment actually needs. A container that
# only serves `/predict` installs `[serve]` and does not pull matplotlib,
# xgboost, or pyarrow, which roughly halves the image.
#
# Note what is *not* here: `shap`. Reason codes are exact SHAP values, computed
# from the model's own coefficients for a linear model and from XGBoost's built-in
# TreeSHAP for a boosted one - see `docs/code/explain.md`. The package would add a
# numba/llvmlite toolchain, and a wheel-availability risk on new Python versions,
# to reach code paths `explain.py` reaches in a dozen lines.
[project.optional-dependencies]
train = [
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "pyarrow>=16.0",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
]
dev = [
    "credit-default-risk-score[train,serve]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.8",
]
tracking = [
    "mlflow>=2.10",
]

[project.scripts]
riskscore = "risk_score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `--strict-markers` turns a typo'd marker into an error instead of a silently
# unfiltered test.
addopts = "--strict-markers"
markers = [
    "slow: exercises the real 1.19 GB dataset or a full model fit; excluded from the default run",
]
filterwarnings = [
    "error::DeprecationWarning:risk_score.*",
]

[tool.coverage.run]
source = ["risk_score"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: mutable defaults, unused loop vars, assert-on-tuple
    "UP",   # pyupgrade
    "SIM",  # simplifiable constructs
    "RET",  # return-path consistency
    "PTH",  # prefer pathlib over os.path
    "C4",   # comprehension shortcuts
    "TRY",  # exception antipatterns (bare raise-from, long try bodies)
    "PD",   # pandas-vet: chained assignment, `.values`, inplace
    "NPY",  # numpy legacy random / aliases
    "RUF",
]
ignore = [
    # TRY003 bans long messages in raise; this project deliberately puts
    # actionable detail (observed date ranges, missing column names) in errors.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on private helpers and build deliberately malformed frames.
"tests/*" = ["PD011"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# sklearn/pandas stubs are incomplete; without this, every `BaseEstimator`
# subclass method is reported as returning `Any` from an untyped base.
disallow_subclassing_any = false
warn_unreachable = true
